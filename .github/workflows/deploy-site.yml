name: Deploy site

# Publishes the Astro site in `site/` to GitHub Pages.
#
# ONE-TIME MANUAL STEP: in the repository's Settings → Pages, set "Source" to
# "GitHub Actions". Without it this workflow builds successfully and deploys
# nothing, because the Pages API refuses artifacts for a repository still
# configured to publish from a branch.
#
# The build runs `npm run build`, whose `prebuild` step is `scripts/sync-docs.mjs`.
# That script exits non-zero on a dead link, so a broken cross-reference in
# `docs/` fails the deploy rather than shipping a 404.
#
# This workflow publishes on its own, without waiting for CI, so it carries its
# own scan: `scripts/moat-gate.mjs` runs over the built output before the Pages
# artifact is uploaded, and a hit fails the build job, so nothing is deployed.
# The private terms come from the MOAT_TERMS Actions secret (see ci.yml's
# `site` job); the gate's public terms are checked whether or not it is set.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in flight; queue behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      - name: Build (docs sync, link check, Astro)
        working-directory: site
        run: npm run build

      # Before the upload, so a hit leaves nothing for the deploy job to publish.
      - name: Scan the output for private terms
        working-directory: site
        env:
          MOAT_TERMS: ${{ secrets.MOAT_TERMS }}
        run: node scripts/moat-gate.mjs

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
