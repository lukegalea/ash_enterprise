name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A failed run tells you nothing if a later push is already superseding it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test

  # The Elixir 1.20 canary preamble. Registers a callback through
  # Kernel.ParallelCompiler.each_long_verification_threshold/2 (falling back
  # to the setter-only /1 form) so any module whose verification runs longer
  # than 10s prints a "[long verification]" line. Large Spark-generated Ash
  # shapes are exactly the stress class docs/research/elixir-120-viability.md
  # warns about, and an unlabeled 30s stall in a compile log is a mystery
  # where this is a measurement.
  #
  # Guarded with function_exported?/3 so it degrades to a no-op instead of a
  # crash on any Elixir without the API. There is no env var that can eval
  # code before mix boots, so the legs that need this run the task under
  # `elixir -e "$CANARY_INSTRUMENT" -S mix ...` -- the -e runs in the same VM
  # and process as mix, before mix starts, and the threshold is state the
  # parallel compiler reads when it compiles later in that same process.
  #
  # Locally, the deeper cut is per-module type-check times (Elixir >= 1.20.2):
  #
  #     mix compile --profile time
  #
  # and, for the dependency wall-time comparison the plan calls for:
  #
  #     MIX_OS_DEPS_COMPILE_PARTITION_COUNT=8 mix deps.compile
  CANARY_INSTRUMENT: |
    kpc = Kernel.ParallelCompiler

    cond do
      Code.ensure_loaded?(kpc) and function_exported?(kpc, :each_long_verification_threshold, 2) ->
        kpc.each_long_verification_threshold(:timer.seconds(10), fn module, ms ->
          IO.puts(:stderr, "[long verification] #{inspect(module)} took #{ms}ms (threshold 10s)")
        end)

      Code.ensure_loaded?(kpc) and function_exported?(kpc, :each_long_verification_threshold, 1) ->
        kpc.each_long_verification_threshold(:timer.seconds(10))

      true ->
        IO.puts(:stderr, "[long verification] each_long_verification_threshold not available; instrumentation skipped")
    end

jobs:
  test:
    name: Compile, test, and check generated code${{ matrix.canary && ' (1.20 canary)' || '' }}
    runs-on: ubuntu-latest

    # Two pairings, one job definition. The 1.18.4 leg is the gate and must
    # behave exactly as it did before the matrix existed. The 1.20.4 leg is
    # the canary from docs/research/elixir-120-viability.md section 5(d): same
    # suite, but continue-on-error, so its failures are information about the
    # migration rather than blocked pull requests. Because a failing step
    # still halts the steps after it, the canary leg reveals its gates in the
    # plan's fix order -- first the WAE compile, then credo, then the suite --
    # while the warning inventory below tracks the burn-down that unblocks
    # each one. OTP stays on 27 for both legs on purpose: the canary varies
    # the compiler, not the ERTS that releases bake (that flip is a later,
    # single commit, per the plan).
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.18.4"
            otp: "27.3"
          - elixir: "1.20.4"
            otp: "27.3.4"
            canary: true

    continue-on-error: ${{ matrix.canary }}

    services:
      # pgvector rather than plain postgres: ash_ai's vectorize block needs the
      # extension to exist, and the repo declares it in installed_extensions, so
      # `mix ash.setup` fails without it.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: ash_enterprise_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # Pinned to the pairing devenv.nix uses. CI drifting from local is how
      # "works on my machine" becomes a class of bug rather than an incident.
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      # Keyed per Elixir version: the legs share nothing. A cache entry
      # written by 1.18.4 must never be restored under the 1.20.4 leg or the
      # reverse -- _build is not portable across compilers, and a stale build
      # would silently skip recompiling half the project.
      - name: Restore dependency and build cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ matrix.elixir }}-

      # `xmllint`, which `boxic_dmn` (under `ash_decisions`) shells out to when it
      # validates a DMN document against the normative XSD.
      #
      # Declared rather than assumed. GitHub's ubuntu images have carried it for
      # years, and relying on that is the trap: the suite passes today and starts
      # failing the week the runner image is rebuilt without it, with nothing in
      # this repository having changed. The Dockerfile and devenv.nix both name it
      # for the same reason -- see the note at the top of the Dockerfile about
      # what happens when those three disagree.
      - name: Install xmllint
        run: sudo apt-get update -y && sudo apt-get install -y libxml2-utils

      # ash_rules and ash_compliance are private, and CI has no credentials for
      # them by default -- `mix deps.get` failed asking for a GitHub username,
      # which stopped the job before `mix test` and meant no branch had run its
      # tests since they were added.
      #
      # Each gets its own READ-ONLY deploy key, because a deploy key is scoped
      # to one repository: one key cannot stand in for the other, and neither
      # can reach anything else. mix.exs declares both with `github:`, which
      # resolves to https, so each URL is rewritten to an SSH host alias bound
      # to exactly one key. Aliases rather than a shared agent: with two keys in
      # one agent SSH offers them in turn and the pairing is incidental, whereas
      # this fails loudly if a key is ever wrong for its repository.
      - name: Authorize the private first-party dependencies
        env:
          COMPLIANCE_KEY: ${{ secrets.ASH_COMPLIANCE_DEPLOY_KEY }}
          RULES_KEY: ${{ secrets.ASH_RULES_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$COMPLIANCE_KEY" > ~/.ssh/ash_compliance
          printf '%s\n' "$RULES_KEY" > ~/.ssh/ash_rules
          chmod 600 ~/.ssh/ash_compliance ~/.ssh/ash_rules
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<'SSHCONF'
          Host gh-ash-compliance
            HostName github.com
            User git
            IdentityFile ~/.ssh/ash_compliance
            IdentitiesOnly yes
          Host gh-ash-rules
            HostName github.com
            User git
            IdentityFile ~/.ssh/ash_rules
            IdentitiesOnly yes
          SSHCONF
          chmod 600 ~/.ssh/config
          git config --global url."git@gh-ash-compliance:lukegalea/ash_compliance".insteadOf "https://github.com/lukegalea/ash_compliance"
          git config --global url."git@gh-ash-rules:lukegalea/ash_rules".insteadOf "https://github.com/lukegalea/ash_rules"

      - run: mix deps.get

      # Dependencies compile in their own invocation, before the gate below.
      # `mix compile --warnings-as-errors` is the static-analysis gate for THIS
      # repository's code -- a dependency left uncompiled here would otherwise
      # compile inside it, and a cold cache (new mix.lock hash, first run on a
      # new branch) would turn a dependency's own warning into a red build:
      # oban carries a dead clause for the engines we do not use, toml still
      # has single-quoted charlists. Their warnings stay visible in this log;
      # they stop pretending to be ours.
      - run: mix deps.compile

      - name: Check formatting
        run: mix format --check-formatted

      - name: Check for unused dependencies
        run: mix deps.unlock --check-unused

      # --warnings-as-errors is the real static-analysis gate in this project.
      # Elixir 1.18's type checker catches more than Dialyzer manages against
      # Spark-generated code -- see docs/manifesto/07-what-we-do-not-have.md.
      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Credo
        run: mix credo --strict

      # Ash derives migrations as a diff against resource snapshots. Without
      # this gate the schema silently drifts from the resources, and the failure
      # surfaces at deploy time in the worst possible place.
      - name: Check Ash-generated code is committed
        run: mix ash.codegen --check

      # docs/roadmap.json is the single source for every status table in the
      # README and in docs/. Same reasoning as the gate above: a derived artifact
      # that can drift from its source will, and a status table that silently
      # disagrees with itself is worse than no status table.
      - name: Check the roadmap tables are rendered
        run: mix ash_enterprise.roadmap --check

      # `--skip` honours the `@sobelow_skip` attributes in the source. There is
      # exactly one, on `AshEnterprise.Audit.Export`, and it says why next to
      # itself -- which is the point of the attribute over a config file.
      - name: Security scan
        run: mix sobelow --config --skip --exit

      - name: Retired and vulnerable dependencies
        run: mix hex.audit

      # The primary leg runs mix exactly as it did before the matrix existed.
      - name: Test
        if: ${{ !matrix.canary }}
        run: mix test

      # Same suite on the canary leg, but under the CANARY_INSTRUMENT preamble
      # so long verifications print "[long verification]" lines into this log.
      - name: Test (1.20 canary)
        if: ${{ matrix.canary }}
        run: elixir -e "$CANARY_INSTRUMENT" -S mix test

      # The agent-facing gate: every relative link in the composed AGENTS.md
      # still resolves, and the semantic manifests (once any exist) still parse
      # with valid ash:v0 symbol ids. The contract step inside it needs
      # ash_agent_tools -- only: :dev, and a path dependency outside this
      # repository -- so under MIX_ENV=test it reports itself skipped and the
      # full run, contracts included, is the dev-env `mix ast.check`.
      # See docs/AST-CHECK.md.
      - name: Agent contracts and rules links
        run: mix ast.check

  dialyzer:
    name: Dialyzer (advisory)
    runs-on: ubuntu-latest
    # DELIBERATELY non-blocking. There is no official guidance for running
    # Dialyzer against Ash or Spark, no canonical ignore file, and Spark's macro
    # expansion produces spurious warnings. Running it as a hard gate would mean
    # either a permanently red build or an ignore file so broad it hides real
    # findings. See docs/manifesto/07-what-we-do-not-have.md#4-dialyzer-certainty.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          elixir-version: "1.18.4"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-dialyzer-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-dialyzer-

      # ash_rules and ash_compliance are private, and CI has no credentials for
      # them by default -- `mix deps.get` failed asking for a GitHub username,
      # which stopped the job before `mix test` and meant no branch had run its
      # tests since they were added.
      #
      # Each gets its own READ-ONLY deploy key, because a deploy key is scoped
      # to one repository: one key cannot stand in for the other, and neither
      # can reach anything else. mix.exs declares both with `github:`, which
      # resolves to https, so each URL is rewritten to an SSH host alias bound
      # to exactly one key. Aliases rather than a shared agent: with two keys in
      # one agent SSH offers them in turn and the pairing is incidental, whereas
      # this fails loudly if a key is ever wrong for its repository.
      - name: Authorize the private first-party dependencies
        env:
          COMPLIANCE_KEY: ${{ secrets.ASH_COMPLIANCE_DEPLOY_KEY }}
          RULES_KEY: ${{ secrets.ASH_RULES_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$COMPLIANCE_KEY" > ~/.ssh/ash_compliance
          printf '%s\n' "$RULES_KEY" > ~/.ssh/ash_rules
          chmod 600 ~/.ssh/ash_compliance ~/.ssh/ash_rules
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<'SSHCONF'
          Host gh-ash-compliance
            HostName github.com
            User git
            IdentityFile ~/.ssh/ash_compliance
            IdentitiesOnly yes
          Host gh-ash-rules
            HostName github.com
            User git
            IdentityFile ~/.ssh/ash_rules
            IdentitiesOnly yes
          SSHCONF
          chmod 600 ~/.ssh/config
          git config --global url."git@gh-ash-compliance:lukegalea/ash_compliance".insteadOf "https://github.com/lukegalea/ash_compliance"
          git config --global url."git@gh-ash-rules:lukegalea/ash_rules".insteadOf "https://github.com/lukegalea/ash_rules"

      - run: mix deps.get
      - run: mkdir -p priv/plts
      - run: mix dialyzer --format github

  # The 1.20 burn-down metric from docs/research/elixir-120-viability.md
  # section 5(d): compile this repository on the canary pairing WITHOUT
  # --warnings-as-errors and bucket the new-in-1.20 warning classes (redundant
  # clause / unused require / type violation / inferred type / deprecation)
  # into the job summary. The counts are the inventory we drive to zero before
  # any of the flips in the plan's fix order -- not a pass/fail gate.
  #
  # Advisory like Dialyzer, for the same class of reason: red here is
  # information about the migration, and must never block a pull request.
  canary-warnings:
    name: Elixir 1.20 canary warning inventory
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      # The canary pairing. 1.20.4, never 1.20.0 -- the compile-time
      # pathologies of the 1.20.0/rc line are closed as of 1.20.3+.
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3.4"
          elixir-version: "1.20.4"

      # The same key the canary leg of the test job derives: same MIX_ENV, same
      # pairing, so deps and _build are shared between the two 1.20 jobs.
      - name: Restore dependency and build cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-1.20.4-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-1.20.4-

      # No database service here: nothing in this job runs the suite, and
      # compilation does not touch Postgres. The private-dependency keys are
      # still required -- deps.get cannot resolve ash_rules or ash_compliance
      # without them. Same block, same reasoning, as the jobs above.
      - name: Authorize the private first-party dependencies
        env:
          COMPLIANCE_KEY: ${{ secrets.ASH_COMPLIANCE_DEPLOY_KEY }}
          RULES_KEY: ${{ secrets.ASH_RULES_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$COMPLIANCE_KEY" > ~/.ssh/ash_compliance
          printf '%s\n' "$RULES_KEY" > ~/.ssh/ash_rules
          chmod 600 ~/.ssh/ash_compliance ~/.ssh/ash_rules
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<'SSHCONF'
          Host gh-ash-compliance
            HostName github.com
            User git
            IdentityFile ~/.ssh/ash_compliance
            IdentitiesOnly yes
          Host gh-ash-rules
            HostName github.com
            User git
            IdentityFile ~/.ssh/ash_rules
            IdentitiesOnly yes
          SSHCONF
          chmod 600 ~/.ssh/config
          git config --global url."git@gh-ash-compliance:lukegalea/ash_compliance".insteadOf "https://github.com/lukegalea/ash_compliance"
          git config --global url."git@gh-ash-rules:lukegalea/ash_rules".insteadOf "https://github.com/lukegalea/ash_rules"

      - run: mix deps.get

      # Dependencies stay OUT of the inventory for the same reason they stay
      # outside the WAE gate: oban's dead clause is oban's to fix (watch list
      # in the report), not ours to burn down.
      - run: mix deps.compile

      # --force so a warm cache cannot hollow out the inventory: the whole
      # project recompiles and every warning the 1.20 compiler emits lands in
      # the captured log. Deliberately NOT --warnings-as-errors -- this is the
      # census, not the gate. The preamble is applied so long verifications
      # land in the same log and get their own row in the summary.
      - name: Compile and capture the full warning output
        run: |
          set -o pipefail
          elixir -e "$CANARY_INSTRUMENT" -S mix compile --force 2>&1 | tee canary-compile.log

      # The buckets, as a table on the job summary, so the burn-down is
      # visible run over run without opening the log. Runs even if the
      # compile failed: a hard crash still leaves warnings worth counting.
      - name: Bucket warnings into the job summary
        if: ${{ !cancelled() }}
        run: bash scripts/canary-warning-buckets.sh canary-compile.log >> "$GITHUB_STEP_SUMMARY"
