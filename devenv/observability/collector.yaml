receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:@OTLP_GRPC@
        max_recv_msg_size_mib: 16
      http:
        endpoint: 127.0.0.1:@OTLP_HTTP@
  # The machine the stack runs on, for SigNoz's Infrastructure > Hosts page (it lists a
  # host once system.cpu.time, system.memory.usage, system.cpu.load_average.15m and
  # system.filesystem.usage arrive with host.name and os.type, which the resourcedetection
  # processor adds). 30s is SigNoz's own default; every scraper here reports a few dozen
  # series. `processes` is the counts scraper, not the per-process one.
  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu: {}
      load: {}
      memory: {}
      paging: {}
      processes: {}
      network: {}
      disk:
        exclude:
          devices: ["^loop.*", "^ram.*"]
          match_type: regexp
      filesystem:
        exclude_fs_types:
          fs_types: [autofs, binfmt_misc, bpf, cgroup, cgroup2, configfs, debugfs, devpts, devtmpfs, fusectl, hugetlbfs, mqueue, nsfs, proc, procfs, pstore, rpc_pipefs, securityfs, selinuxfs, squashfs, sysfs, tracefs]
          match_type: strict
        exclude_mount_points:
          mount_points: ["/proc/.*", "/sys/.*", "/dev/.*", "/run/.*", "/var/lib/docker/.*", "/nix/store"]
          match_type: regexp
processors:
  resourcedetection:
    detectors: [env, system]
    system:
      hostname_sources: [os]
    timeout: 2s
    override: false
  memory_limiter:
    check_interval: 2s
    # The Go heap is collected toward 128 MiB (GOMEMLIMIT in observability.sh). RSS
    # runs 50-90 MB above the heap, and reached 218 MB after three browser-suite runs,
    # which is why the collector's budget is 250 MB. The limiter refuses -- dropping
    # spans -- only when a burst outpaces the collector for a whole check interval,
    # which the ClickHouse exporters' 1s batch timeout makes rare.
    limit_mib: 160
    spike_limit_mib: 32
  batch:
    # 500: half the batch halves the sending queues' worst case. ClickHouse ingests
    # a 500-row part as fast as a 1000-row one.
    send_batch_size: 500
    send_batch_max_size: 500
    timeout: 1s
@SPANMETRICS_PROCESSOR@
exporters:
  clickhousetraces:
    datasource: tcp://127.0.0.1:@CLICKHOUSE_TCP@/signoz_traces
    use_new_schema: true
    sending_queue: {queue_size: 20}
  signozclickhousemetrics:
    dsn: tcp://127.0.0.1:@CLICKHOUSE_TCP@/signoz_metrics
  clickhouselogsexporter:
    dsn: tcp://127.0.0.1:@CLICKHOUSE_TCP@/signoz_logs
    timeout: 10s
    use_new_schema: true
    sending_queue: {queue_size: 20}
  metadataexporter:
    cache:
      provider: in_memory
    dsn: tcp://127.0.0.1:@CLICKHOUSE_TCP@/signoz_metadata
    enabled: true
    timeout: 45s
extensions:
  health_check:
    endpoint: 127.0.0.1:@COLLECTOR_HEALTH@
service:
  telemetry:
    logs:
      level: warn
    metrics:
      level: none
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, @SPANMETRICS_REF@batch]
      exporters: [clickhousetraces, metadataexporter]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [signozclickhousemetrics, metadataexporter]
    # Its own pipeline, so the host's resource attributes never land on the application's
    # metrics.
    metrics/host:
      receivers: [hostmetrics]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [signozclickhousemetrics, metadataexporter]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [clickhouselogsexporter, metadataexporter]
