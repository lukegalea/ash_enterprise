type Position {
  id: ID!

  "Tenant discriminator. CDM-native: every Dataverse table carries it."
  organizationId: ID!

  "The record's lifecycle status. Managed by AshStateMachine: only declared transitions may change it."
  lifecycleStatus: String!

  "Row version, incremented on write. Used for optimistic locking."
  versionNumber: Int!

  "The original creation time, when a record was imported and its real created_on differs from the import time."
  overriddenCreatedOn: DateTime

  "Set when an application or delegate modified the record on a user's behalf."
  modifiedOnBehalfById: ID

  "Set when an application or delegate created the record on a user's behalf."
  createdOnBehalfById: ID

  "The user who last modified this record."
  modifiedById: ID

  "The user who created this record."
  createdById: ID

  modifiedOn: DateTime!

  createdOn: DateTime!

  name: String!

  description: String

  parentPositionId: ID

  "The position this one reports to. Null for the top of a hierarchy."
  parentPosition: Position

  childPositions(
    "How to sort the records in the response"
    sort: [PositionSortInput]

    "A filter to limit the results"
    filter: PositionFilterInput

    "The number of records to return from the beginning. Maximum 250"
    first: Int

    "Show records before the specified keyset."
    before: String

    "Show records after the specified keyset."
    after: String

    "The number of records to return to the end. Maximum 250"
    last: Int
  ): KeysetPageOfPosition!

  "Dataverse statecode, derived from the status's owning state. Read-only -- this is why the pair cannot drift."
  stateCode: Int

  "Dataverse statuscode, derived from lifecycle_status. Read-only."
  statusCode: Int
}

